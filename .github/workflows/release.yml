name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Step 1: read the package version and check whether the tag already exists ──
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      tag_exists: ${{ steps.check_tag.outputs.exists }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q "refs/tags"; then
            echo "Tag v${VERSION} already exists – skipping release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag v${VERSION} does not exist – will create release."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Step 2: build and publish (only when the tag does not yet exist) ──────────
  release-windows:
    needs: check-version
    if: needs.check-version.outputs.tag_exists == 'false'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Windows installer
        run: yarn build:win
        env:
          # Disable electron-builder's built-in publish so we control the upload below
          EP_DRAFT: true

      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
